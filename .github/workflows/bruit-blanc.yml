name: bruit-blanc

on:
  push:
    branches: [main]
    paths: ['apps/bruit-blanc/**', '.github/workflows/bruit-blanc.yml']
  pull_request:
    paths: ['apps/bruit-blanc/**', '.github/workflows/bruit-blanc.yml']
  workflow_dispatch:

# Filled in after running scripts/setup-signing.sh in Cloud Shell (not secret).
# While empty, the signed bundle is skipped.
env:
  WIF_PROVIDER: ''
  SIGNING_SERVICE_ACCOUNT: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: apps/bruit-blanc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/bruit-blanc/app/build/outputs/apk/debug/*.apk

      # Signed release bundle on main only. The upload key lives in Secret Manager and is
      # read through Workload Identity Federation, so GitHub stores no key or password.
      - name: Authenticate to Google Cloud
        id: gcp
        if: github.ref == 'refs/heads/main' && env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SIGNING_SERVICE_ACCOUNT }}

      - name: Fetch upload key
        if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Signed release bundle
        if: steps.gcp.outcome == 'success'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gcloud secrets versions access latest --secret=bruit-blanc-upload-keystore \
            --out-file="$RUNNER_TEMP/upload.jks"
          PW="$(gcloud secrets versions access latest --secret=bruit-blanc-upload-password)"
          echo "::add-mask::$PW"
          UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" UPLOAD_KEYSTORE_PASSWORD="$PW" \
            UPLOAD_KEY_PASSWORD="$PW" UPLOAD_KEY_ALIAS=upload \
            ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload release bundle
        if: steps.gcp.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/bruit-blanc/app/build/outputs/bundle/release/*.aab
