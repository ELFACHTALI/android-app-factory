name: bruit-blanc

on:
  push:
    branches: [main]
    paths: ['apps/bruit-blanc/**', '.github/workflows/bruit-blanc.yml']
  pull_request:
    paths: ['apps/bruit-blanc/**', '.github/workflows/bruit-blanc.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bruit-blanc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/bruit-blanc/app/build/outputs/apk/debug/*.apk

      # Signed release bundle, only when the upload key secrets exist (never on forks or PRs).
      - name: Decode upload key
        id: key
        if: github.event_name != 'pull_request'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "No upload key configured; skipping the signed bundle."
            exit 0
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"

      - name: Signed release bundle
        if: steps.key.outputs.path != ''
        env:
          UPLOAD_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Upload release bundle
        if: steps.key.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/bruit-blanc/app/build/outputs/bundle/release/*.aab
