name: bruit-blanc

on:
  push:
    branches: [main]
    paths: ['apps/bruit-blanc/**', '.github/workflows/bruit-blanc.yml']
  pull_request:
    paths: ['apps/bruit-blanc/**', '.github/workflows/bruit-blanc.yml']
  workflow_dispatch:

# Valeurs affichées par scripts/setup-signing.sh (non secrètes).
env:
  WIF_PROVIDER: projects/999140038701/locations/global/workloadIdentityPools/github/providers/github-actions
  SIGNING_SERVICE_ACCOUNT: github-signing@android-app-factory-511217.iam.gserviceaccount.com
  # Ce compte de service est invité dans la Play Console : chaque push sur main publie le bundle
  # et la fiche sur la piste de test interne. Mettre 'false' pour ne faire que le bundle signé.
  PLAY_PUBLISH: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: apps/bruit-blanc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # recordRoborazziDebug lance les tests unitaires et génère les captures du Play Store.
      - name: Unit tests, store screenshots, lint and debug build
        run: ./gradlew --no-daemon recordRoborazziDebug lintDebug assembleDebug

      - name: Upload store listing
        uses: actions/upload-artifact@v4
        with:
          name: store-listing
          path: apps/bruit-blanc/app/src/main/play

      # Publie aussi la fiche sur la branche store-listing, consultable directement sur GitHub.
      - name: Publish listing to the store-listing branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp -r app/src/main/play "$RUNNER_TEMP/play"
          cd "$RUNNER_TEMP/play"
          git init -q -b store-listing
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Store listing from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" store-listing

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: apps/bruit-blanc/app/build/outputs/apk/debug/*.apk

      # Bundle release signé, sur main uniquement. La clé d'upload est dans Secret Manager et
      # lue via Workload Identity Federation : GitHub ne stocke ni clé ni mot de passe.
      - name: Authenticate to Google Cloud
        id: gcp
        if: github.ref == 'refs/heads/main' && env.WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SIGNING_SERVICE_ACCOUNT }}

      - name: Fetch upload key
        if: steps.gcp.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Signed release bundle (and Play publishing when enabled)
        if: steps.gcp.outcome == 'success'
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gcloud secrets versions access latest --secret=bruit-blanc-upload-keystore \
            --out-file="$RUNNER_TEMP/upload.jks"
          PW="$(gcloud secrets versions access latest --secret=bruit-blanc-upload-password)"
          echo "::add-mask::$PW"
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" UPLOAD_KEYSTORE_PASSWORD="$PW" \
            UPLOAD_KEY_PASSWORD="$PW" UPLOAD_KEY_ALIAS=upload
          trap 'rm -f "$RUNNER_TEMP/upload.jks"' EXIT
          if [ "$PLAY_PUBLISH" != "true" ]; then
            ./gradlew --no-daemon bundleRelease
            exit 0
          fi
          # Deux appels séparés : chacun valide sa propre « edit » Play. Le bundle part ainsi en
          # test interne même si la fiche échoue (voir docs/JOURNAL.md).
          ./gradlew --no-daemon publishReleaseBundle
          ./gradlew --no-daemon publishReleaseListing

      - name: Upload release bundle
        if: steps.gcp.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: apps/bruit-blanc/app/build/outputs/bundle/release/*.aab
